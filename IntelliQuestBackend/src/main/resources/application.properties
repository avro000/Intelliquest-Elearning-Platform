spring.application.name=IntelliQuestBackend
server.port=9092
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Database Connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/e_learning?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Admin*2004}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.default_batch_fetch_size=30
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=false

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=IntelliQuestHikariPool

# Tomcat Thread Pool Configuration
server.tomcat.threads.max=150
server.tomcat.threads.min-spare=20
server.tomcat.connection-timeout=20000
server.tomcat.max-connections=8192
server.tomcat.accept-count=100

# OAuth2 Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your_google_client_id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your_google_client_secret}
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.client-name=Google

# Redirect after login
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth?prompt=select_account
spring.security.oauth2.client.provider.google.token-uri=https://www.googleapis.com/oauth2/v4/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=email

# Redirect user to this URI after login success
spring.security.oauth2.client.login-success-url=/oauth2/success
jwt.secret=${JWT_SECRET:dGhpc2lzYXZlcnlzZWN1cmVsb25nYmFzZTY0ZW5jb2RlZGtleQ==}

# === Mail Configuration ===
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your_mail_username}
spring.mail.password=${MAIL_PASSWORD:your_mail_password}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
logging.level.org.springframework.mail=DEBUG

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB

# Payment API Keys
razorpay.key_id=${RAZORPAY_KEY_ID:your_razorpay_key_id}
razorpay.key_secret=${RAZORPAY_KEY_SECRET:your_razorpay_key_secret}

# Cloudflare R2 Object Storage
cloudflare.r2.account-id=${R2_ACCOUNT_ID:your_cloudflare_account_id}
cloudflare.r2.access-key-id=${R2_ACCESS_KEY_ID:your_cloudflare_access_key_id}
cloudflare.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:your_cloudflare_secret_access_key}
cloudflare.r2.bucket-name=${R2_BUCKET_NAME:intelliquest-assets}
cloudflare.r2.public-url=${R2_PUBLIC_URL:https://pub-f371bf872b2f43108e6a4453b8edcdb3.r2.dev}
