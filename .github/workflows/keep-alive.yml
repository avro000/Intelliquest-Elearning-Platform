name: Keep Render Backend Awake

on:
  schedule:
    # Runs every 10 minutes to prevent the primary Spring Boot backend from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Spring Boot Backend
        run: |
          echo "Pinging Backend..."
          curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://intelliquest-elearning-platform.onrender.com/ || true
